# Data cleaning configuration.

# Input and output paths.
input_path: data/raw/DataAnalyst.csv
output_path: data/clean/jobs_clean.csv

# Replace configured invalid values with null.
replace_invalid_values:
  -1: null

# Company name cleaning rules.
company_name:
  enabled: true
  columns:
    - Company Name
  split_on: "\n" # Split on line breaks.
  split_index: 0 # Keep the first segment.

# Salary estimate cleaning rules.
salary_estimate:
  enabled: true
  columns:
    - Salary Estimate
  replace_texts: # Text values to remove.
    - "(Glassdoor est.)"

# Deduplication rules.
dedup:
  enabled: true

# Columns to drop.
drop_columns:
  - "Unnamed: 0"

# Null-rate monitoring and warnings.
missing_rate:
  columns:
    - Company Name
    - Salary Estimate
    - Location
    - Job Title
    - Industry
  warn_threshold: 0.30 # Warn when the null rate is at least 30%.
