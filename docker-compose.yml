services:
  db:
    image: postgres:18

    container_name: de_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}

      POSTGRES_USER: ${DB_USER}

      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]

      interval: 5s

      timeout: 5s

      retries: 10

  app:
    build: .

    container_name: de_app

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_HOST: db

    volumes:
      - .:/app

    command: python main.py

volumes:
  postgres_data:
